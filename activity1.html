<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><H1>Form to make a new account</H1></center>
    <center>
    <form>
        <fieldset>
        <legend>Form details</legend>
        <label>
            What is your first name?
        </label>
        <input type="text" id="Fname" required>
        <br>
        <br>
        <label>
            What is your last name?
        </label>
        <input type="text" id="Lname" required>
        <br>
        <br>
        <label>
            What is your email adress?
        </label>
        <input type="email" id="email">
        <br>
        <br>
        <label>
            What is your password?
        </label>
        <input type="password" id="password">
        <br>
        <br>
        <label>
            What is your gender?
        </label>
        <input type="radio" id="Male" Name="gender">Male
        <input type="radio" id="Female" Name="gender">Female
        <br><br>
        <label>
            What is your favourite food?
        </label>
        <input type="checkbox" id="ffood" Name =food>Pizza
        <input type="checkbox" id="fffood" Name =food>Pasta
        <input type="checkbox" id="ffffood" Name =food>Dosa
        <input type="checkbox" id="ffffffood" Name =food>Cake
        <br><br>
        <label>
            What is country are you from?
        </label>
        <select name="Country" id="Country">
            <option value="Greece">Greece</option>
            <option value="England">England</option>
            <option value="India">India</option>
            <option value="China">China</option>
            <option value="Australia">Australia</option>
            <option value="US">US</option>
            <option value="Russia">Russia</option>
         </select>
        <br><br>
         <label>What year were you born?</label>
        <input type="date" id="birthday">
        <br><br><br>
        <input type="submit" name="Submit" id="Finish">
    </fieldset>
    </form>
    </center>
</body>
</html>
